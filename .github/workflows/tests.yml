name: Tests

on:
  pull_request:
  push:
    branches:
      - main
      - stable*

permissions:
  contents: read

concurrency:
  group: tests-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest

    env:
      APP_ID: context_agent
      APP_HOST: 127.0.0.1
      APP_PORT: 9081
      APP_SECRET: test-secret
      APP_VERSION: 0.0.0
      NEXTCLOUD_URL: http://127.0.0.1:8080
      APP_PERSISTENT_STORAGE: ${{ github.workspace }}/../persistent_storage

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # the release tags are needed to check that every release has conversation token fixtures
          fetch-depth: 0
          fetch-tags: true

      - name: Setup python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 #v7.1.0
        with:
          python-version: '3.13'

      - name: Install poetry
        run: |
          pipx install poetry
          # pipx's bin dir is not on PATH on our runners
          echo "$(pipx environment --value PIPX_BIN_DIR)" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: |
          poetry install
          poetry run pip install pytest==8.4.2

      - name: Run tests
        run: |
          mkdir -p "$APP_PERSISTENT_STORAGE"
          poetry run python -m pytest -v tests
